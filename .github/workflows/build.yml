name: "Build"
env:
  DotNetVersion: "10.0.401"
  DotNetVersion2: "9.0.318"
  DotNetVersion3: "8.0.425"
  DotNetVersion4: "11.0.100-rc.1.26425.128"
  Artifacts: ${{ github.workspace }}/artifacts/
  Coverage: ${{ github.workspace }}/coverage/
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  CLR_OPENSSL_VERSION_OVERRIDE: 1.1
defaults:
  run:
    shell: pwsh
on:
  pull_request:
    branches:
      - master
      - feature/*
  workflow_dispatch:
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-15-intel
    name: "Build (${{ matrix.platform }})"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: "false"
          fetch-depth: "0"

      - name: 🔨 Use .NET Core SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ env.DotNetVersion3 }}
            ${{ env.DotNetVersion2 }}
            ${{ env.DotNetVersion }}
            ${{ env.DotNetVersion4 }}

      - name: 🎁 dotnet tool restore
        run: |
          dotnet tool restore

      - name: 🍰 Run Cake
        run: |
          dotnet cake --configuration=Release --verbosity=Verbose --target=Build

      - name: ⬆ Publish test modules
        uses: actions/upload-artifact@v4
        with:
          name: "test-modules-${{ matrix.platform }}"
          path: bin/Release/*.Tests/net10.0/
          if-no-files-found: error
          retention-days: 1

      - name: ⬆ Publish Logs
        uses: actions/upload-artifact@v4
        continue-on-error: true
        if: ${{ always() }}
        with:
          name: "logs - ${{ github.workflow }} ${{ matrix.os }}"
          path: "${{ env.Artifacts }}/logs/"

  packaging:
    name: Packaging
    uses: ./.github/workflows/package.yml

  test:
    name: "Test (${{ matrix.runner.platform }}, ${{ matrix.shard.name }})"
    needs: build
    runs-on: ${{ matrix.runner.os }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - platform: linux
            os: ubuntu-22.04
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-15-intel
        shard:
          - name: shard1
            testProjects: OmniSharp.Lsp.Tests,OmniSharp.MSBuild.Tests,OmniSharp.Script.Tests,OmniSharp.Tests,OmniSharp.Stdio.Tests,OmniSharp.Http.Tests
          - name: shard2
            testProjects: OmniSharp.Roslyn.CSharp.Tests,OmniSharp.DotNetTest.Tests,OmniSharp.Cake.Tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: "1"
          fetch-tags: "false"

      - name: 🔨 Use .NET Core SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ env.DotNetVersion3 }}
            ${{ env.DotNetVersion2 }}
            ${{ env.DotNetVersion }}
            ${{ env.DotNetVersion4 }}

      - name: 🎁 dotnet tool restore
        run: |
          dotnet tool restore

      - name: ⬇ Download test modules
        uses: actions/download-artifact@v4
        with:
          name: "test-modules-${{ matrix.runner.platform }}"
          path: bin/Release/

      - name: 🍰 Run tests
        uses: nick-invision/retry@v2
        with:
          shell: bash
          timeout_minutes: 40
          max_attempts: 3
          retry_on: error
          command: |
            dotnet cake --configuration=Release --verbosity=Verbose --target=TestFromBuild --test-project="$TEST_PROJECT" --use-global-dotnet-sdk
        env:
          TEST_PROJECT: ${{ matrix.shard.testProjects }}

      - name: ⬆ Publish test logs
        uses: actions/upload-artifact@v4
        continue-on-error: true
        if: ${{ always() }}
        with:
          name: "test-logs-${{ matrix.runner.platform }}-${{ matrix.shard.name }}"
          path: "${{ env.Artifacts }}/logs/"
