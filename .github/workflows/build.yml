name: "Build"
env:
  DotNetVersion: "10.0.400"
  DotNetVersion2: "9.0.306"
  DotNetVersion3: "8.0.415"
  DotNetVersion4: "11.0.100-rc.1.26425.128"
  Artifacts: ${{ github.workspace }}/artifacts/
  Coverage: ${{ github.workspace }}/coverage/
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  CLR_OPENSSL_VERSION_OVERRIDE: 1.1
defaults:
  run:
    shell: pwsh
on:
  pull_request:
    branches:
      - master
      - feature/*
  workflow_dispatch:
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15-intel]
    name: "Build"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: "false"
          fetch-depth: "0"

      - name: 🔨 Use .NET Core SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ env.DotNetVersion3 }}
            ${{ env.DotNetVersion2 }}
            ${{ env.DotNetVersion }}
            ${{ env.DotNetVersion4 }}

      - name: 🎁 dotnet tool restore
        run: |
          dotnet tool restore

      - name: 🍰 Run Cake
        run: |
          dotnet cake --configuration=Release --verbosity=Verbose --target=CI --publish-all --archive

      - name: ⬆ Publish Logs
        uses: actions/upload-artifact@v4
        continue-on-error: true
        if: ${{ always() }}
        with:
          name: "logs - ${{ github.workflow }} ${{ matrix.os }}"
          path: "${{ env.Artifacts }}/logs/"

      - name: ⬆ Publish Packages
        uses: actions/upload-artifact@v4
        continue-on-error: true
        if: ${{ always() }}
        with:
          name: "packages"
          path: "${{ env.Artifacts }}/package/"

      - name: ⬆ Publish Deployment
        uses: actions/upload-artifact@v4
        continue-on-error: true
        if: ${{ always() }}
        with:
          name: "deployment"
          path: "${{ env.Artifacts }}/deployment/"

      - name: ⬆ Publish NuGet
        uses: actions/upload-artifact@v4
        continue-on-error: true
        if: ${{ always() }}
        with:
          name: "nuget"
          path: "${{ env.Artifacts }}/nuget/"

      - name: ⬆ Publish Scripts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        if: ${{ always() }}
        with:
          name: "scripts - ${{ matrix.os }}"
          path: "${{ env.Artifacts }}/scripts/"
