name: "Tests"
env:
  DotNetVersion: "10.0.105"
  DotNetVersion2: "9.0.306"
  DotNetVersion3: "8.0.415"
  Artifacts: ${{ github.workspace }}/artifacts/
  Coverage: ${{ github.workspace }}/coverage/
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  VSTEST_TESTHOST_SHUTDOWN_TIMEOUT: "1000"
defaults:
  run:
    shell: pwsh
on:
  pull_request:
    branches:
      - master
      - feature/*
    tags:
      - "*"
  workflow_dispatch:
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
        testProjects:
          - OmniSharp.MSBuild.Tests,OmniSharp.Roslyn.CSharp.Tests,OmniSharp.DotNetTest.Tests,OmniSharp.Cake.Tests
          - OmniSharp.Lsp.Tests,OmniSharp.Script.Tests,OmniSharp.Tests,OmniSharp.Stdio.Tests,OmniSharp.Http.Tests
    name: "Test"
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          clean: "false"
          fetch-depth: "0"

      - name: 🔨 Use .NET Core SDKs
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: |
            ${{ env.DotNetVersion3 }}
            ${{ env.DotNetVersion2 }}
            ${{ env.DotNetVersion }}

      - name: 🎁 dotnet tool restore
        run: |
          dotnet tool restore

      - name: 🍰 Run Cake
        uses: nick-invision/retry@v2
        with:
          shell: bash
          timeout_minutes: 40
          max_attempts: 3
          retry_on: error
          command: |
            dotnet cake --configuration=Release --verbosity=Verbose --target=Test --test-project="$TEST_PROJECT"
        env:
          TEST_PROJECT: ${{ matrix.testProjects }}

      - name: ⬆ Publish Logs
        uses: actions/upload-artifact@v4
        continue-on-error: true
        if: ${{ always() }}
        with:
          name: "logs - ${{ github.workflow }} ${{ matrix.os }}"
          path: "${{ env.Artifacts }}/logs/"
